[project]
name = "rag-samples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "embeddings>=0.0.8",
    "faiss-cpu>=1.15.1",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-embeddings-ollama>=0.10.0",
    "load-dotenv>=0.1.0",
]

[project.scripts]
rag-samples = "rag_samples:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
